---
name: Test dotfiles

on:
  pull_request:
  push:
    branches:
      - master
      - refactor

jobs:
  layer-1-makefile:
    name: "Layer 1 — Makefile safety"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Makefile tests
        run: bash tests/test_makefile.sh

  layer-2-molecule:
    name: "Layer 2 — Molecule container"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Molecule stack
        run: pip install molecule==6.0.3 molecule-docker==2.0.0 ansible-core==2.21.0

      - name: Install community.docker collection
        run: ansible-galaxy collection install community.docker

      # default: fresh install against a clean container (no pre-existing dotfiles).
      # Covers Steps 2-7 assertions and git-wrapper behaviour.
      # Molecule's built-in idempotence step re-runs converge once to catch any
      # task that reports 'changed' on a second consecutive run.
      - name: Run molecule (default scenario)
        run: molecule test

      # rerun-idempotent: dirty-slate install — container is seeded with existing
      # ~/.zshrc and ~/.bashrc containing MY_CUSTOM_VAR before the playbook runs.
      # Exercises edge cases the default scenario cannot reach:
      #   - backup fires on pre-existing files and preserves their content
      #   - no re-backup on second run (files are symlinks after first run)
      #   - .gitconfig remains a regular file after a second playbook run
      # converge.yml runs playbook.yml twice with assertions between the runs;
      # the built-in idempotence step is therefore disabled in molecule.yml to
      # avoid a redundant 3rd/4th run that would cause spurious failures.
      - name: Run molecule (rerun-idempotent scenario)
        run: molecule test -s rerun-idempotent
