---
- name: "Prepare: install system dependencies"
  hosts: dotfiles
  gather_facts: no
  tasks:
    - name: Install system dependencies
      apt:
        name:
          - git
          - make
          - zsh   # required by verify.yml git-wrapper tasks (zsh -c 'source .aliases ...')
        state: present
        update_cache: yes
      become: yes

- name: "Prepare: copy dotfiles repo into container"
  hosts: dotfiles
  connection: local
  gather_facts: no
  tasks:
    - name: Copy dotfiles repo into container
      copy:
        src: "{{ playbook_dir }}/../../"
        dest: /tmp/dotfiles
