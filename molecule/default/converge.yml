---
# Molecule converge: copies repo into container then runs the dotfiles playbook

- name: "Pre-converge: copy dotfiles repo into container"
  hosts: dotfiles
  connection: local
  gather_facts: no
  tasks:
    - name: Copy dotfiles into container
      copy:
        src: "{{ playbook_dir }}/../../"
        dest: /tmp/dotfiles

- import_playbook: playbook.yml
