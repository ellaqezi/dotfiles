---
# Molecule converge: runs the playbook twice to verify idempotency.
# Backup seeding is handled in prepare.yml.

# First run: applies the dotfiles setup; triggers backup of seeded .zshrc/.bashrc.
- import_playbook: playbook.yml

# Post-first-run: assert backups were created and contain the original content.
- name: "Post-first-run: verify backup behaviour"
  hosts: dotfiles
  connection: local
  gather_facts: yes
  vars:
    home_dir: "{{ ansible_facts['env'].HOME }}"
  tasks:
    - name: "Step 1: Verify backup files were created on first run"
      find:
        paths: "{{ home_dir }}"
        patterns: ".zshrc.bak-*"
      register: backups

    - name: Show backups found
      debug:
        msg: "Found {{ backups.matched }} backup file(s)"

    - name: "Step 1: Verify original content is in backup"
      shell: |
        grep -l "MY_CUSTOM_VAR" {{ home_dir }}/.zshrc.bak-* 2>/dev/null || echo "not_found"
      register: backup_content
      changed_when: false

    - name: Assert backup contains original content
      assert:
        that: backup_content.stdout != 'not_found'
        fail_msg: "Original .zshrc content (MY_CUSTOM_VAR) was not found in any backup file"
        success_msg: "✓ Original config preserved in backup"

# Second run: idempotency check — re-running the playbook must not change state.
- import_playbook: playbook.yml

# Post-second-run: assert no destructive changes occurred on the second run.
- name: "Post-second-run: idempotency assertions"
  hosts: dotfiles
  connection: local
  gather_facts: yes
  vars:
    home_dir: "{{ ansible_facts['env'].HOME }}"
  tasks:
    - name: "Idempotency: .gitconfig should still be a regular file"
      stat:
        path: "{{ home_dir }}/.gitconfig"
      register: gitconfig_second_run
      failed_when: gitconfig_second_run.stat.islnk | bool
      changed_when: false

    - name: Report idempotency result
      debug:
        msg: "✓ Playbook is idempotent — .gitconfig remains a regular file after second run"
